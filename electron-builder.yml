appId: com.kylezhou.chinese-anki
productName: Chinese Anki
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
extraResources:
  - from: seed
    to: seed
asarUnpack:
  - resources/**
mac:
  target: dmg
  category: public.app-category.education
  # Required for the voice tutor: macOS refuses microphone access without a usage string.
  extendInfo:
    NSMicrophoneUsageDescription: Chinese Anki uses the microphone so you can speak to the AI tutor.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
win:
  target: nsis
linux:
  target: AppImage
  category: Education
